name: Sync climate normals

# Měsíční obnova klimatických normálů (sekce „Průměrné měsíční teploty
# a srážky" na stránkách počasí): dlouhodobé měsíční průměry z Meteostat API
# pro rodičovská místa stránek kategorie „Počasí" (endpoint
# /api/sync-climate-normals, viz src/endpoints/syncClimateNormals.ts).
# Normály jsou třicetileté průměry — mění se prakticky jen když přibude nová
# stránka počasí; měsíční běh drží kvótu RapidAPI (500 dotazů/měsíc, ~174
# stránek/běh) a nové stránky doplní nejpozději do měsíce. Stejný vzor jako
# sync-affiliate-deals — autentizovaný HTTP požadavek na běžící produkci.
on:
  schedule:
    - cron: '17 4 3 * *' # 3. den v měsíci ve 4:17 UTC, mimo špičku i ostatní syncy
  workflow_dispatch: {} # umožní ruční spuštění z webu GitHubu (např. po přidání stránky počasí)

concurrency:
  group: sync-climate-normals
  cancel-in-progress: false # ať se souběžný ruční běh nezruší uprostřed zápisu

jobs:
  sync:
    runs-on: ubuntu-latest
    # Job jen volá HTTP endpoint — GITHUB_TOKEN nepotřebuje žádná práva.
    permissions: {}
    timeout-minutes: 15
    steps:
      - name: Zavolat /api/sync-climate-normals
        # Sync stahuje z Meteostatu s rozestupy (rate limit RapidAPI) —
        # při ~174 stránkách počasí běží požadavek několik minut, proto
        # max-time 720. Secrets jdou přes env, ne přímo do příkazu (neobjeví
        # se v command line procesu a zvláštní znaky nerozbijí quoting).
        env:
          SYNC_URL: ${{ secrets.SYNC_ANALYTICS_URL }}
          SYNC_SECRET: ${{ secrets.ANALYTICS_SYNC_SECRET }}
        run: |
          curl -fsS -X POST "$SYNC_URL/api/sync-climate-normals" \
            -H "X-Sync-Secret: $SYNC_SECRET" \
            --connect-timeout 10 --max-time 720 --retry 2 --retry-delay 60
