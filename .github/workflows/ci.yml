name: CI

on: [push]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Stejný základ jako produkce (deploy/docker-compose.yml): Debian/glibc + ICU
        # cs-CZ. Major verze pinnutá (ne `latest`) — po vydání PostgreSQL 19 by `latest`
        # potichu testoval jinou verzi než prod.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: payload
          POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=cs-CZ --locale=en_US.utf8'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting (Prettier)
        run: npx prettier --check .

      # Caddy na produkci pouští na origin jen rozsahy Cloudflare; když CF
      # nějaký přidá, musí se allowlist obnovit — jinak část návštěvníků
      # dostane zavřené spojení. Drift = červený build (výpadek sítě jen varuje).
      - name: Cloudflare allowlist v Caddyfile je aktuální
        run: node scripts/check-cloudflare-ranges.mjs

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/payload
          PAYLOAD_SECRET: ci-secret
          CLOUDINARY_CLOUD_NAME: dummy
          CLOUDINARY_API_KEY: dummy
          CLOUDINARY_API_SECRET: dummy
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: dummy
          S3_ACCESS_KEY_ID: dummy
          S3_SECRET: dummy
          NODE_ENV: test
        run: |
          npx playwright install --with-deps chromium
          pnpm run test
